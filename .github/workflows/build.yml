name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")', 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Set Version
      id: version
      shell: bash
      run: |
        # 取最近一个 tag 中的版本号（如 2.99.0.0），末位自增
        last=$(git tag --list '[0-9]*' --sort=-v:refname | head -n 1)
        last=${last:-2.99.0.0}
        base=${last%.*}
        patch=$(echo "$last" | awk -F. '{print $NF}')
        version="$base.$((patch + 1))"
        echo "last=$last" >> $GITHUB_OUTPUT
        echo "version=$version" >> $GITHUB_OUTPUT
        echo "发布版本：$version（上一个：$last）"

    - name: Download Release Artifact
      uses: actions/download-artifact@v6
      with:
        name: Release ${{ env.describe }}
        path: dist

    - name: Assemble Package
      shell: bash
      run: |
        version="${{ steps.version.outputs.version }}"
        mkdir -p pkg
        cp "dist/Plain Craft Launcher 2.exe" "pkg/Plain Craft Launcher 2.exe"
        # 附上许可证与改动说明
        cp LICENCE "pkg/LICENCE"
        cat > "pkg/README-修改说明.md" <<EOF
        # PCL 第三方修改版（$version）

        本软件是**第三方基于 PCL 独立进行二次创作的产物**，非官方发布。

        - 原作者：龙腾猫跃（https://github.com/Meloong-Git/PCL）
        - 上游版本：${{ steps.version.outputs.last }}
        - 赞助入口：https://meloong.com/afd/a/LTCat

        ## 本版本改动

        移除了上游 2.99.0.0 中硬编码的 \`RestrictMcDownload\` 开关，
        恢复 Minecraft 原版下载、整合包安装与版本修改功能。

        ## 许可

        继续遵循仓库根目录 LICENCE（《PCL 分发有限许可》与《PCL 存储库合理使用指南》）。
        EOF
        cd pkg && zip -r "../PCL-$version-个人修复版.zip" . && cd ..

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        version="${{ steps.version.outputs.version }}"
        gh release create "$version" "PCL-$version-个人修复版.zip" \
          --title "PCL $version 个人修复版" \
          --notes "第三方基于 PCL 独立修改的产物，非官方发布。

        基于上游 ${{ steps.version.outputs.last }}，移除硬编码的 MC 下载限制，恢复原版下载、整合包安装与版本修改功能。

        原作者：龙腾猫跃 · https://github.com/Meloong-Git/PCL"
